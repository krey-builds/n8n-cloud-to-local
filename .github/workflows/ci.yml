name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --check backup.js && node --check restore.js && node --check relink-credentials.js
      - run: npm test
      - name: Compose file is valid
        if: matrix.node-version == 22
        run: N8N_ENCRYPTION_KEY=ci docker compose config --quiet

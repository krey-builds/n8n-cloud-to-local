# Free n8n Community Edition on your own machine.
# Start: docker compose up -d     Stop: docker compose down
# NEVER run "docker compose down -v": -v deletes the volume that holds your workflows and logins.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8   # pinned so a pull can't upgrade n8n under you
    container_name: n8n-local
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env before starting}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_LOCAL_WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
